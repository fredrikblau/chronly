name: Feature request
description: Suggest something Chronly should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you were in, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Mockups, links, or how another app handles it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works without accounts, tracking, or new host permissions (or I explain why not above).
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
