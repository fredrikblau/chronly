name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run verify:manifests
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      # Loading an unpacked extension needs a headed Chromium, so the runner
      # gets a virtual framebuffer.
      - run: xvfb-run -a npm run test:e2e
