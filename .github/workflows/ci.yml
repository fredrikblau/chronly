name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole suite before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  # When Release calls this suite, github.workflow is "Release", so a release
  # run never cancels, or is cancelled by, ordinary CI on the same branch. A
  # manual release adds its tag (empty for every other run), so releasing two
  # tags in a row does not cancel the first.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run zip
      - run: npm run zip:firefox
      - run: npm run verify:manifests
      - run: npm run lint:firefox
      # GitHub's Ubuntu runners ship Firefox and geckodriver.
      - run: npm run test:firefox
      - run: npx playwright install --with-deps chromium
      # Loading an unpacked extension needs a headed Chromium, so the runner
      # gets a virtual framebuffer.
      - run: xvfb-run -a npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
