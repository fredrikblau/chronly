name: Release

# Publishes the Chrome, Firefox, and source zips as a GitHub release. Three
# ways in, all of which run the full CI suite first and publish nothing unless
# it passes:
#
# - Push a tag such as v0.2.0, or v0.2.0-rc.1 for a prerelease.
# - Run this workflow from the Actions tab and type the tag. It is created on
#   the commit the run uses (main by default) if it does not exist yet.
# - Publish a release with a new tag on GitHub. The zips are added to it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, such as v0.2.0 or v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Typed by a person on a manual run, so it only ever reaches the shell
      # through this variable and is checked before use.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a version tag like v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          case "${TAG#v}" in
            "$version" | "$version"-*) ;;
            *)
              echo "::error::Tag $TAG does not match version $version in package.json"
              exit 1
              ;;
          esac
          # An existing tag must name the commit CI just checked.
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null || true)"
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG already points at $tagged, not $GITHUB_SHA"
            exit 1
          fi
      - run: npm run zip
      - run: npm run zip:firefox
      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Drafted on GitHub: keep its notes and settings, add the builds.
            gh release upload "$TAG" .output/*.zip --clobber
            exit 0
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" .output/*.zip \
            --target "$GITHUB_SHA" --generate-notes \
            --title "Chronly ${TAG#v}" "${prerelease[@]}"
