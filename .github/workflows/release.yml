name: Release

# Push a tag such as v0.2.0, or v0.2.0-rc.1 for a prerelease, to publish the
# Chrome, Firefox, and source zips as a GitHub release. The full CI suite runs
# first, and nothing is published unless it passes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "${GITHUB_REF_NAME#v}" in
            "$version" | "$version"-*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
              exit 1
              ;;
          esac
      - run: npm run zip
      - run: npm run zip:firefox
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" .output/*.zip \
            --verify-tag --generate-notes \
            --title "Chronly ${GITHUB_REF_NAME#v}" "${prerelease[@]}"
